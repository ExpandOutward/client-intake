<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jobs | Construction Business</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-bar">
      <div class="brand">
        <span class="mark" aria-hidden="true"><span></span><span></span></span>
        <div>
          <p class="brand-name">Construction Business</p>
          <p class="brand-tag">Office build-outs &amp; renovations</p>
        </div>
      </div>
      <div id="admin-actions" class="topbar-actions" hidden>
        <button type="button" id="backup-jobs" class="secondary">Backup</button>
        <button type="button" id="restore-jobs" class="secondary">Restore</button>
        <input id="restore-file" type="file" accept=".csv,text/csv" hidden />
        <button type="button" id="reset-demo" class="secondary">Reset demo</button>
        <button type="button" id="sign-out" class="secondary">Sign out</button>
      </div>
    </div>
  </header>

  <main class="wrap wide">
    <p class="eyebrow">Admin</p>
    <h1>Jobs</h1>
    <p class="lede">Review incoming requests and update status. Each change emails the notification address.</p>

    <form id="login-form">
      <label>
        Password
        <input type="password" name="key" required autocomplete="current-password" />
        <span class="field-hint">Use the same demo password that unlocks the intake form.</span>
      </label>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error" hidden role="alert"></p>
    </form>

    <div id="board-tools" hidden>
      <form id="search-form" class="board-search">
        <label>
          Search jobs
          <input
            type="search"
            id="job-search"
            name="q"
            placeholder="Company, contact, or email"
            autocomplete="off"
          />
        </label>
        <div class="board-search-actions">
          <button type="submit">Search</button>
          <button type="button" id="list-all" class="secondary">List All</button>
        </div>
      </form>
      <div class="board-filters">
        <label class="board-sort">
          Sort
          <select id="job-sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="az">Company A–Z</option>
            <option value="za">Company Z–A</option>
          </select>
        </label>
        <label class="board-status-filter">
          Status
          <select id="job-status-filter">
            <option value="">Any status</option>
          </select>
        </label>
      </div>
    </div>

    <p id="board-summary" class="hint" hidden></p>
    <p id="board-empty" hidden>No requests yet.</p>
    <p id="board-error" class="error" hidden role="alert"></p>
    <p id="board-note" class="hint" hidden></p>
    <div id="job-list" hidden></div>
    <nav id="board-pager" class="board-pager" hidden>
      <p id="pager-status" class="hint"></p>
      <div class="pager-actions">
        <button type="button" id="pager-prev" class="secondary">Previous</button>
        <button type="button" id="pager-next" class="secondary">Next</button>
      </div>
    </nav>
  </main>

  <footer class="site-foot">
    <p>Construction Business · Staff only</p>
  </footer>
  <script src="admin.js"></script>
</body>
</html>
